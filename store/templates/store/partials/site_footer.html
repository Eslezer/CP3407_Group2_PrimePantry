<footer style="padding:63px 34px 43px;text-align:center;background:var(--ink);margin-top:34px;">
  <div style="font-size:11px;font-weight:600;line-height:1;letter-spacing:1.5px;text-transform:uppercase;color:#c9a9a4;margin-bottom:36px;">Copyright © 2026 PrimePantry. All rights reserved.</div>
  <nav style="display:flex;justify-content:center;align-items:center;gap:23px;flex-wrap:wrap;">
    <a href="{% url 'store:home' %}" style="display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#fff;">
      <span style="width:8px;height:8px;border-radius:9999px;{% if active_nav == 'home' %}background:var(--primary);border:1px solid var(--primary);{% else %}border:1px solid #7a6663;{% endif %}display:inline-block;box-sizing:border-box;"></span>Home
    </a>
    <a href="{% url 'store:catalog' %}" style="display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#fff;">
      <span style="width:8px;height:8px;border-radius:9999px;{% if active_nav == 'catalog' %}background:var(--primary);border:1px solid var(--primary);{% else %}border:1px solid #7a6663;{% endif %}display:inline-block;box-sizing:border-box;"></span>Catalog
    </a>
    <a href="{% url 'store:cart' %}" style="display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#fff;">
      <span style="width:8px;height:8px;border-radius:9999px;{% if active_nav == 'cart' %}background:var(--primary);border:1px solid var(--primary);{% else %}border:1px solid #7a6663;{% endif %}display:inline-block;box-sizing:border-box;"></span>Cart
    </a>
    <a href="{% url 'store:my_orders' %}" style="display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#fff;">
      <span style="width:8px;height:8px;border-radius:9999px;{% if active_nav == 'orders' %}background:var(--primary);border:1px solid var(--primary);{% else %}border:1px solid #7a6663;{% endif %}display:inline-block;box-sizing:border-box;"></span>My Orders
    </a>
  </nav>
</footer>
