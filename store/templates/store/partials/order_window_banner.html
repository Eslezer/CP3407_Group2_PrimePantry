<div style="background:var(--primary);border-bottom:1px solid var(--primary-dark);">
  <div style="max-width:1320px;margin:0 auto;padding:14px 34px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;font-size:11px;font-weight:600;line-height:1;letter-spacing:1.5px;text-transform:uppercase;color:#f3d9d5;text-align:center;">
    <span>Window closes {{ ow_cutoff_label }}</span>
    <span>·</span>
    <span><span id="ow-countdown" data-cutoff="{{ ow_cutoff_ms }}">{{ ow_countdown_text }}</span> left</span>
    <span>·</span>
    <a href="{% url 'store:catalog' %}" style="color:#fff;text-decoration:underline;">Shop now →</a>
  </div>
</div>
