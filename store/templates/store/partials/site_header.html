<header style="display:flex;align-items:center;justify-content:space-between;padding:23px 34px;background:var(--bg);border-bottom:2px solid var(--primary);">
  <a href="{% url 'store:home' %}" style="font-family:'Fraunces',serif;font-weight:700;font-size:19px;line-height:1;letter-spacing:0.5px;color:var(--primary);">PrimePantry</a>
  <div style="display:flex;align-items:center;gap:28px;">
    <a href="{% url 'store:catalog' %}" style="font-size:11px;font-weight:600;line-height:1;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);">Catalog</a>
    <a href="{% url 'store:cart' %}" style="font-size:11px;font-weight:600;line-height:1;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);">Cart{% if cart_count %} ({{ cart_count }}){% endif %}</a>
    <a href="{% url 'store:auth' %}" style="font-size:11px;font-weight:600;line-height:1;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);">Account</a>
  </div>
</header>
