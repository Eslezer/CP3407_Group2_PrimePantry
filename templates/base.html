{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PrimePantry{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241012;
  --muted:#8a716c;
  --line:#e9dcd8;
  --bg:#faf5f2;
  --card:#f3e6e1;
  --primary:#7a1220;
  --primary-dark:#54080f;
  --primary-tint:#f6e3e0;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jost',ui-sans-serif,system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Fraunces',ui-serif,Georgia,serif;font-weight:700;}
a{color:var(--ink);text-decoration:none;}
a:hover{text-decoration:underline;}
img{display:block;}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
